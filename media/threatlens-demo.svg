<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">ThreatLens dashboard preview</title>
  <desc id="desc">A static dashboard showing a detected malicious domain with risk score, verdict drift chart, evidence group bars, and alert panel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#061922"/>
      <stop offset="100%" stop-color="#0b2737"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#0d1f2d"/>
      <stop offset="100%" stop-color="#122d3f"/>
    </linearGradient>
    <linearGradient id="scoreGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <g opacity="0.2">
    <path d="M0 120H1400M0 220H1400M0 320H1400M0 420H1400M0 520H1400M0 620H1400M0 720H1400" stroke="#274d66" stroke-width="1"/>
    <path d="M220 0V820M420 0V820M620 0V820M820 0V820M1020 0V820M1220 0V820" stroke="#274d66" stroke-width="1"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="70" width="1240" height="680" rx="28" fill="url(#panel)" stroke="#2f5a75" stroke-width="2"/>
  </g>

  <g>
    <rect x="115" y="95" width="180" height="36" rx="18" fill="#0d2d3e" stroke="#3c7190"/>
    <text x="145" y="119" fill="#dfeefc" font-size="18" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">THREATLENS</text>
  </g>

  <g>
    <rect x="1048" y="100" width="92" height="32" rx="16" fill="#ff5d5d" opacity="0.15"/>
    <circle cx="1068" cy="116" r="6" fill="#ff6b6b"/>
    <text x="1082" y="122" fill="#ffc6c6" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">LIVE</text>
  </g>

  <g>
    <rect x="115" y="150" width="350" height="190" rx="20" fill="#0c2336" stroke="#2f536d"/>
    <text x="142" y="178" fill="#93b7d1" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">TARGET</text>
    <text x="142" y="214" fill="#dfeefc" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">login-bank[.]com</text>
    <text x="142" y="250" fill="#93b7d1" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">RISK SCORE</text>

    <text x="142" y="308" fill="url(#scoreGlow)" font-size="54" font-weight="800" font-family="Segoe UI, Arial, sans-serif">87</text>
    <text x="216" y="306" fill="#f4d79d" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">/100</text>

    <circle cx="392" cy="294" r="62" fill="none" stroke="#1f4258" stroke-width="10"/>
    <circle cx="392" cy="294" r="62" fill="none" stroke="url(#scoreGlow)" stroke-width="10" stroke-linecap="round" stroke-dasharray="290 80" transform="rotate(-90 392 294)"/>
  </g>

  <g>
    <rect x="505" y="150" width="760" height="190" rx="20" fill="#0c2336" stroke="#2f536d"/>
    <text x="532" y="178" fill="#93b7d1" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">VERDICT DRIFT</text>
    <text x="532" y="208" fill="#dfeefc" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Score increased by +24 in the last 18 hours</text>

    <path d="M532 260 C600 245, 650 210, 696 235 S790 228, 860 260 S980 242, 1048 255 S1150 220, 1260 238" fill="none" stroke="#6bc5ff" stroke-width="3"/>
    <circle cx="870" cy="260" r="6" fill="#f0b54a"/>
    <circle cx="1048" cy="255" r="6" fill="#f0b54a"/>
    <circle cx="1260" cy="238" r="6" fill="#ff6b6b"/>
  </g>

  <g>
    <rect x="115" y="365" width="460" height="300" rx="20" fill="#0c2336" stroke="#2f536d"/>
    <text x="142" y="394" fill="#93b7d1" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">EVIDENCE GROUPS</text>

    <g transform="translate(142 420)">
      <rect width="350" height="20" rx="10" fill="#142f40"/>
      <rect width="264" height="20" rx="10" fill="#1fb6ff"/>
      <text x="365" y="15" fill="#dfeefc" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">AV DETECTIONS</text>
    </g>

    <g transform="translate(142 485)">
      <rect width="350" height="20" rx="10" fill="#142f40"/>
      <rect width="183" height="20" rx="10" fill="#ff9f43"/>
      <text x="365" y="15" fill="#dfeefc" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">REPUTATION</text>
    </g>

    <g transform="translate(142 550)">
      <rect width="350" height="20" rx="10" fill="#142f40"/>
      <rect width="268" height="20" rx="10" fill="#64d9c2"/>
      <text x="365" y="15" fill="#dfeefc" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">DOMAIN INFRA</text>
    </g>

    <g transform="translate(142 615)">
      <rect width="350" height="20" rx="10" fill="#142f40"/>
      <rect width="212" height="20" rx="10" fill="#ff6b6b"/>
      <text x="365" y="15" fill="#dfeefc" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">BEHAVIOR</text>
    </g>
  </g>

  <g>
    <rect x="610" y="365" width="655" height="300" rx="20" fill="#0c2336" stroke="#2f536d"/>
    <text x="638" y="394" fill="#93b7d1" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1.5">HISTORY / ALERTS</text>

    <rect x="638" y="420" width="560" height="210" rx="16" fill="#0d1d2b" stroke="#2b556d"/>
    <text x="658" y="458" fill="#93b7d1" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif">09:10</text>
    <text x="748" y="458" fill="#dfeefc" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Domain age short; registration anomaly</text>
    <rect x="658" y="475" width="130" height="8" rx="4" fill="#ff9f43"/>

    <text x="658" y="534" fill="#93b7d1" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif">09:42</text>
    <text x="748" y="534" fill="#dfeefc" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Redirect chain: 3 hops → credential harvesting</text>
    <rect x="658" y="551" width="260" height="8" rx="4" fill="#ff6b6b"/>

    <text x="658" y="590" fill="#93b7d1" font-size="12" font-weight="700" font-family="Segoe UI, Arial, sans-serif">10:20</text>
    <text x="748" y="590" fill="#dfeefc" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Threat feed confidence rose to 87/100</text>
    <rect x="658" y="607" width="380" height="8" rx="4" fill="#64d9c2"/>
  </g>

  <g>
    <rect x="1125" y="645" width="135" height="54" rx="14" fill="#0d1b26" stroke="#4c7d9b"/>
    <circle cx="1145" cy="667" r="7" fill="#ff6b6b"/>
    <text x="1158" y="674" fill="#edf8ff" font-size="18" font-weight="700" font-family="Segoe UI, Arial, sans-serif">ALERT</text>
  </g>
</svg>
